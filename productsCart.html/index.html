 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0%;
        padding: 0%;
        box-sizing: border-box;
    }
    body{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        padding-left: 100px;
        /* padding-top: 30px; */
        margin-top: 20px;
        gap: 20px;
        /* height: 190vh; */
        /* padding: 20px; */
        

        /* background-color: aqua; */
    }
    img{
         width:100%;
            height:270px;
            object-fit:cover;
            border-radius:10px;
            background-color:rgb(243,243,243);
            
        
    }
    div{
        /* margin: auto; */
        width: 400px;
        height: 50vh;
         /* border: 1px solid; */
         
border-radius: 10px;
 display: flex;
 /* margin-bottom: 50px; */
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-shadow: rgba(14, 30, 37, 0.12) 0px 2px 4px 0px, rgba(14, 30, 37, 0.32) 0px 2px 16px 0px;
        
        
    }
    h3{
        font-family:system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        margin-top: 10px;
        
        /* border: 1px solid; */
        
    }
    h4{
padding: 10px;
        border-radius: 10px;
        background-color: white;
        
    }
    p{
        font-family: Verdana, Geneva, Tahoma, sans-serif;
        font-size: smaller;
        text-align: center;
        /* margin: auto; */
        color: gray;
    }
    h2{
font-family: 'Poppins', sans-serif;     
font-size: medium;
margin-bottom: 10px;
/* text-align: left; */
    }
    .card{
            width:300px;
            padding:15px;
            border-radius:10px;
            position:relative;
            box-shadow: rgba(14, 30, 37, 0.12) 0px 2px 4px 0px,
                        rgba(14, 30, 37, 0.32) 0px 2px 16px 0px;

            display:flex;
            flex-direction:column;
            align-items:center;
        }   
.favorite{
    position:absolute;
    top:15px;
    right:15px;
    font-size:30px;
    cursor:pointer;
    color:gray;
    transition:0.3s;
}

/* Active Color */
.favorite.active{
    color:red;
    transform:scale(1.2);
}
</style>

<body>
    
     <script>
        
       fetch("https://dummyjson.com/products")
       .then((res)=> res.json())
       .then((data) => { console.log(data);
        
        for(let i = 0; i < data.products.length; i++){
        const divTag = document.createElement("div")
        divTag.classList.add("card");
         const favIcon = document.createElement("span");
        favIcon.innerHTML = "❤";
        favIcon.classList.add("favorite");
         favIcon.addEventListener("click", () => {
            favIcon.classList.toggle("active");
            });
        const imgTag = document.createElement("img")
        const price = document.createElement("h4")
        const title = document.createElement("h3")
        const rating = document.createElement("h2")
        const description = document.createElement("p")
        // const brand = document.createElement("h4")
        rating.innerText = `Rating : ${data.products[i].rating}`
        title.innerText = data.products[i].title
        price.innerText =`$${data.products[i].price}`;  
        description.innerText = data.products[i].description
        
        imgTag.src = data.products[i].images[0];
        divTag.appendChild(favIcon);
        divTag.appendChild(imgTag)
        divTag.appendChild(title)
        divTag.appendChild(description)
        divTag.appendChild(price);
        divTag.appendChild(rating)
        document.body.appendChild(divTag)
        

        }
        
       })
       
       .catch((err)=> console.log(err))
       

    </script>
</body>
</html>
